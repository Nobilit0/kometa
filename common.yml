#==================== nobilit0 ====================#
templates:
  my_global_setup:
#==================== Movies ====================#
	  Movies:
		library_name: Movies
		metadata_files:
		 # - repo: 
		remove_overlays: false           # Set this to true to remove all overlays
		collection_files:
		- default: basic                   # This is a file within Kometa's defaults folder
		- default: imdb                    # This is a file within Kometa's defaults folder
		  template_variables:
			  # Ensure all collections are explicitly enabled
			use_top: true
			use_popular: true
			use_lowest: true

			  # Isolate Radarr commands only to the IMDb Top 250 collection
			radarr_add_missing_top: true
			radarr_add_missing_popular: true
			radarr_quality_top: HD-1080p
			radarr_quality_popular: HD-1080p
			  # Force Radarr to immediately trigger a search ONLY for Top 250 missing items
			radarr_search_top: false
			radarr_search_popular: false

		- repo: nwithan8/collections/holidays/movies

		  # ========================================================
		  # Trending Movies
		  # ========================================================
		- repo: nobilit0/collections/trending/movies
		  template_variables:

			  # ------------------------------------------------------
			  # 🍿 At The Box Office
			  # ------------------------------------------------------
			radarr_add_missing_boxoffice: true
			radarr_search_boxoffice: false

			  # ------------------------------------------------------
			  # 📈 Trending Now
			  # ------------------------------------------------------
			radarr_add_missing_trending: true
			radarr_search_trending: false

			  # ------------------------------------------------------
			  # 👀 What Everyone Is Watching
			  # ------------------------------------------------------
			radarr_add_missing_everyone: true
			radarr_search_everyone: false




		- default: resolution
		- default: universe
		- default: franchise
		- default: based
		- default: anilist
		- default: studio
		- default: tautulli
		
		
	#==================== Overlays ====================#
		overlay_files:
		- default: ribbon
