  TV Shows:
    collection_files:
      - default: basic
      - default: imdb
      - repo: nwithan8/collections/trending/shows
      - default: universe
      - default: franchise
      - default: based
      - default: network
      - default: studio
      - default: tautulli
    operations:
      mass_metadata_update:
        ratings:
          audience: tmdb
          critic: imdb
          user: mdb_tomatoes
          episode_audience: tmdb
          episode_critic: imdb
    overlay_files:
      - default: ribbon
      - default: status
        template_variables:
          back_color_airing: '#016920FF'
          back_color_returning: '#81007FFF'
          back_color_canceled: '#B52222FF'
          back_color_ended: '#000847FF'
          horizontal_offset: 0
          vertical_offset: 242
      - default: audio_codec
      - default: audio_codec
        template_variables:
          builder_level: season
      - default: audio_codec
        template_variables:
          builder_level: episode
      - default: language_count
      - default: languages
        template_variables:
          vertical_offset: 383
      - default: languages
        template_variables:
          builder_level: season
      - default: languages
        template_variables:
          builder_level: episode
      - default: languages
        template_variables:
          builder_level: episode
          use_subtitles: true
      - default: resolution
      - default: resolution
        template_variables:
          builder_level: season
      - default: resolution
        template_variables:
          builder_level: episode
      - default: versions
      - default: versions
        template_variables:
          builder_level: episode
      - default: video_format
      - default: video_format
        template_variables:
          builder_level: season
      - default: video_format
        template_variables:
          builder_level: episode
      - default: streaming
      - default: studio
      - default: network
      - default: episode_info
        template_variables:
          builder_level: episode
      - default: runtimes
        template_variables:
          builder_level: episode

