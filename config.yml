  Movies:
    remove_overlays: false
    collection_files:
    - default: basic
    - default: imdb
      template_variables:
        use_top: true
        use_popular: true
        use_lowest: true
        radarr_add_missing_top: true
        radarr_add_missing_popular: true
        radarr_quality_top: HD-1080p
        radarr_quality_popular: HD-1080p
        radarr_search_top: false
        radarr_search_popular: false
    - repo: nwithan8/collections/holidays/movies
    - repo: nobilit0/collections/trending/movies
      template_variables:
        radarr_add_missing_boxoffice: true
        radarr_search_boxoffice: false
        radarr_add_missing_trending: true
        radarr_search_trending: false
        radarr_add_missing_everyone: true
        radarr_search_everyone: false
    - default: resolution
    - default: universe
    - default: franchise
    - default: based
    - default: anilist
    - default: studio
    - default: tautulli
    overlay_files:
    - default: ribbon
    - default: audio_codec
    - default: languages
      template_variables:
        languages: [af, am, ar, sq, hy, eu, bn, bg, my, ca, zh, hr, cs, da, nl, en, eo, et, tl, fi, fr, gl, ka, de, el, gu, he, hi, hu, is, id, ga, it, ja, kn, km, ko, la, lv, lt, mk, ms, ml, mr, ne, no, fa, pl, pt, pa, ro, ru, sr, si, sk, sl, es, sw, sv, ta, te, th, tr, uk, ur, vi, cy, yo, zu]
    - default: resolution
    - default: runtimes
    - default: versions
    - default: video_format
    - default: streaming
    - default: studio

